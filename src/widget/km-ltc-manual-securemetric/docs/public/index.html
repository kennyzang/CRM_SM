<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM User Manual</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="container">
        <div class="logo">
          <h1>CRM User Manual</h1>
          <p class="subtitle">Step-by-step guides &amp; best practices</p>
        </div>
        <div class="header-info">
          <div class="lang-switch">
            <button id="btn-en" class="lang-btn active" onclick="app.setLang('en')">EN</button>
            <button id="btn-zh" class="lang-btn" onclick="app.setLang('zh')">中文</button>
          </div>
          <span class="version">v1.0</span>
          <span class="update-date"></span>
        </div>
      </div>
    </header>

    <div class="main-layout">
      <nav class="sidebar">
        <div class="nav-header">
          <div class="nav-title">
            <span class="nav-icon-lg">📋</span>
            <span>Contents</span>
          </div>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              id="search-input"
              type="search"
              placeholder="Search..."
              autocomplete="off"
              oninput="app.onSearch(this.value)"
            >
            <button class="search-clear" id="search-clear" onclick="app.clearSearch()" title="Clear">✕</button>
          </div>
        </div>
        <div class="nav-section">
          <!-- populated by app.js -->
        </div>
      </nav>

      <main class="main-content">
        <!-- populated by app.js -->
      </main>
    </div>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 Securemetric CRM. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <!-- Client-side Markdown rendering (no server needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
