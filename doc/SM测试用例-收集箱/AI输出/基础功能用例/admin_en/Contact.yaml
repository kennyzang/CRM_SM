---
cases:

  - id: TC-CONTACT-001
    module: Contact
    name: Create Contact—Normal Flow
    category: 新建
    role: Sales Admin
    priority: P0
    precondition: |
      Logged in CRM
      Has customer data
    steps: |
      1.List page
      2.Create
      3.Name/Gender/Biz Type
      4.Mobile or Email
      5.Save
    expected: |
      1.Saved
      2.Appears in list
    notes: |
      Required: Name, Gender, Biz Type
    status: Draft

  - id: TC-CONTACT-002
    module: Contact
    name: Create Contact—Required Field Validation
    category: 新建/校验
    role: Sales Admin
    priority: P0
    precondition: |
      Logged in CRM
      On create form
    steps: |
      1.Leave Name/Gender/Biz Type/Mobile&Email empty
      2.Check validation hints
      3.Fill all required and save
    expected: |
      1.Name required hint
      2.Gender required hint
      3.Biz Type required hint
      4."Mobile or Email" hint
      5.Save succeeds
    status: Draft

