- id: TC-PL-005
  module: P&L
  name: 【SOW#6】P&L→Quotation Workflow Separation
  category: CustomRule/Workflow
  role: Sales Rep
  priority: P0
  source: 'SOW#6 (Easycraft custom): Separate P&L and Quotation; system generates quotation from P&L data'
  precondition: 'Opportunity X exists, product data available

    '
  steps: '1.Create P&L under Oppty X, fill cost and selling price

    2.Submit P&L

    3.Click "Generate Quotation"

    4.Check auto-navigation to quotation form

    5.Verify quotation data matches P&L

    '
  expected: '1.P&L and Quotation are separate forms

    2.Quotation generated directly from P&L

    3.Quotation auto-fills products/amounts/currency from P&L

    '
  status: Draft
- id: TC-PL-006
  module: P&L
  name: 【SOW#7】P&L Pricing Logic—Markup% + Discount% + Currency Recalc
  category: CustomRule/Pricing
  role: Sales Rep
  priority: P0
  source: 'SOW#7 (Easycraft custom): Inputs (list price, cost, markup%, discount%); markup first then discount; currency override triggers recalc'
  precondition: 'Product exists, cost=1000, list price=2000

    '
  steps: '1.Create P&L, add line item, input list price and cost

    2.Set markup% to 20%

    3.Check calculated selling price

    4.Set discount% to 10%

    5.Check final price (markup first, then discount)

    6.Switch currency to another

    7.Check auto recalculation

    '
  expected: '1.Selling price after markup = cost × (1 + 20%)

    2.After discount = marked up price × (1 - 10%)

    3.Calc order: markup first, then discount

    4.Currency switch triggers auto recalculation

    '
  status: Draft
