  - id: TC-CUSTOMER-011
    module: Customer
    name: 【SOW#2】Customer "Is Partner" Boolean Field
    category: ConfigRule/Field
    role: Sales Rep
    priority: P1
    source: "SOW#2 (Securemetric config): The Customer form requires a Boolean field/flag to indicate if a customer is a 'Partner'"
    precondition: |
      On customer form edit mode
    steps: |
      1.Create customer, find "Is Partner" field
      2.Set to Yes, save
      3.Open customer detail
      4.Edit, toggle to No
      5.Save
    expected: |
      1.Customer form has "Is Partner" boolean field
      2.Set to Yes → detail shows partner customer
      3.Can be modified
    status: Draft
