- id: TC-LEAD-011
  module: Lead
  name: 【SOW#2】Lead Classification—Select Customer for Partner
  category: CustomRule/Linkage
  role: Sales Rep
  priority: P0
  source: 'SOW#2 (Securemetric config): Leads must be classified as ''End User'' or ''Partner''. If ''Partner'' is selected, the Sales Rep must be able to select a company from the existing Customer database.'
  precondition: 'At least one existing customer C;

    Lead form configured

    '
  steps: '1.Create lead, set classification to "End User"

    2.Check the customer field behavior

    3.Change classification to "Partner"

    4.Check customer field becomes mandatory with existing customer dropdown

    5.Select customer C

    6.Save

    '
  expected: '1."End User": customer field optional/hidden

    2."Partner": customer field mandatory, can only select existing

    3.Saved, lead linked to customer C

    '
  status: Draft
- id: TC-LEAD-012
  module: Lead
  name: 【SOW#1】Company RegCode Conflict Check
  category: CustomRule/Conflict
  role: Sales Rep
  priority: P0
  source: 'SOW#1 (Easycraft custom): When creating a new Lead, the system must validate ''Company Registration Code'' against the database to prevent duplicate participation or conflict'
  precondition: 'Lead L exists with "Company Registration Code" REG-001;

    Another lead or data also uses REG-001

    '
  steps: '1.Create a new lead

    2.Enter REG-001 in company registration code field

    3.Try to save

    4.Enter a new unused registration code

    5.Try to save

    '
  expected: '1.Save fails, system prompts registration code conflict

    2.New registration code saves normally

    '
  status: Draft
- id: TC-LEAD-013
  module: Lead
  name: 【SOW#3】Lead Cross-Sell Conflict Prevention
  category: CustomRule/Conflict
  role: Sales Rep
  priority: P0
  source: 'SOW#3 (Easycraft custom): If a Sales Rep attempts to add a Lead where the associated Customer is already owned/handled by another Sales Rep, the system must trigger a conflict warning and prevent the form submission (no auto-populate permissions)'
  precondition: 'Customer C is owned by Sales Rep A (A is C''s owner);

    Sales Rep B (different owner) is logged in

    '
  steps: '1.B creates a lead, selects customer C in "Related Customer" field

    2.Check system behavior

    3.Try to force submit

    4.B creates another lead, selects customer D (not owned by other reps)

    '
  expected: '1.System triggers conflict warning: "This customer is already handled by another sales rep"

    2.Form submission blocked

    3.Selecting non-conflict customer D → submits normally

    '
  status: Draft
