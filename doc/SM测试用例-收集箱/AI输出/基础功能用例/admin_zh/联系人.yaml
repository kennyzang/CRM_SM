---
cases:

  - id: TC-CONTACT-001
    module: 联系人
    name: 新建联系人—正常流程
    category: 新建
    role: 销售管理员
    priority: P0
    precondition: |
      已登录CRM
      有客户数据
    steps: |
      1.进入列表页
      2.点击新建
      3.填写姓名/性别/业务类型
      4.填写手机或邮件
      5.点击保存
    expected: |
      1.保存成功
      2.列表出现新记录
    notes: |
      必填3个:姓名、性别、业务类型
    status: 草稿

  - id: TC-CONTACT-002
    module: 联系人
    name: 新建联系人—必填项校验
    category: 新建/校验
    role: 销售管理员
    priority: P0
    precondition: |
      已登录CRM
      在新建表单
    steps: |
      1.姓名留空/性别不选/业务类型不选/手机和邮件都留空
      2.分别验证各必填字段的提示信息
      3.填写必填后再次保存
    expected: |
      1.姓名必填提示
      2.性别必填提示
      3.业务类型必填提示
      4.手机或邮件至少填一项提示
      5.全部填完后保存成功
    status: 草稿

