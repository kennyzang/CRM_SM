- id: TC-PL-010
  module: P&L
  name: 【SOW#11】损益循环与多年逻辑
  category: CustomRule/Recurring
  role: 销售人员
  priority: P0
  source: SOW需求#11（Easycraft定制开发）：行项目'循环'复选框，勾选纳入循环计算，提供第3、4年添加部分并自动计算总额
  precondition: '有产品数据

    '
  steps: '1.新建损益表单，添加行项目A（循环勾选）和行项目B（不循环）

    2.设置第1年数据

    3.添加第2年部分，观察自动复制的内容

    4.添加第3年部分

    5.查看各年份汇总和总金额

    '
  expected: '1.循环项目自动复制到后续年份

    2.非循环项目不复制

    3.系统自动计算各年份小计和总金额

    '
  status: 草稿
