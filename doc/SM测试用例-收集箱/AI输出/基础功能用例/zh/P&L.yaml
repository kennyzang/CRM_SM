- id: TC-PL-005
  module: P&L
  name: 【SOW#6】损益→报价工作流分离
  category: CustomRule/Workflow
  role: 销售人员
  priority: P0
  source: SOW需求#6（Easycraft定制开发）：损益表单和客户报价表单分离，从损益数据直接生成报价单
  precondition: '有商机X，有产品数据

    '
  steps: '1.在商机X下创建损益表单，填写成本和售价

    2.提交损益表单

    3.点击"生成报价"

    4.观察是否自动跳转到报价单表单

    5.检查报价单数据是否与损益一致

    '
  expected: '1.损益与报价是两个独立表单

    2.从损益直接生成报价单

    3.报价单自动填充损益中的产品/金额/货币

    '
  status: 草稿
- id: TC-PL-006
  module: P&L
  name: 【SOW#7】损益定价逻辑—加价%+折扣%+货币覆盖重算
  category: CustomRule/Pricing
  role: 销售人员
  priority: P0
  source: SOW需求#7（Easycraft定制开发）：输入项（标价、成本、加价%、折扣%），先加价再折扣，覆盖货币时自动重算
  precondition: '有产品，成本1000，标价2000

    '
  steps: '1.新建损益表单，添加行项目，输入标价和成本

    2.设置加价%为20%

    3.观察计算后的售价

    4.再设置折扣%为10%

    5.观察最终价格（先加价再折扣）

    6.切换货币为另一种

    7.观察是否自动重新计算

    '
  expected: '1.加价后售价 = 成本 × (1 + 20%)

    2.折扣后 = 加价后售价 × (1 - 10%)

    3.计算顺序：先加价再折扣

    4.切换货币后金额自动重算

    '
  status: 草稿
- id: TC-PL-007
  module: P&L
  name: 【SOW#8】利润率控制—低利润率自动路由CFO审批
  category: ConfigRule/Approval
  role: 销售人员
  priority: P0
  source: SOW需求#8（Securemetric配置）：目标利润率%字段，若低于目标利润率自动路由到CFO审批分支
  precondition: '产品主数据已配置目标利润率%为30%

    '
  steps: '1.新建损益表单，输入数据使利润率低于30%

    2.提交审批

    3.观察审批流程走向

    4.输入数据使利润率高于30%

    5.提交审批

    6.观察审批流程走向

    '
  expected: '1.利润率低于目标→审批流自动路由到CFO分支

    2.利润率高于目标→走普通审批流

    '
  status: 草稿
- id: TC-PL-008
  module: P&L
  name: 【SOW#9】版本控制—损益/报价版本管理
  category: CustomRule/Version
  role: 销售人员
  priority: P0
  source: SOW需求#9（Easycraft定制开发）：报价单和损益表单支持版本控制（v1.0、v1.1），报告取最新版本，历史版本保留
  precondition: '有一份已提交的损益表单

    '
  steps: '1.打开已提交的损益表单

    2.创建新版本v1.1

    3.修改部分数据

    4.保存新版

    5.查看版本历史列表

    6.切换到v1.0查看旧版

    7.查看关联报告引用的版本

    '
  expected: '1.版本号自动递增（v1.0→v1.1）

    2.历史版本只读可查看

    3.报告取最新版本数据

    '
  status: 草稿
