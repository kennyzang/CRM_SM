  - id: TC-CUSTOMER-011
    module: 客户
    name: 【SOW#2】客户"是否伙伴"布尔标识
    category: ConfigRule/Field
    role: 销售人员
    priority: P1
    source: "SOW需求#2（Securemetric配置）：客户表单须有布尔字段标识客户是否为'伙伴'"
    precondition: |
      在客户表单编辑模式
    steps: |
      1.新建客户，找到"是否伙伴"字段
      2.设置为"是"，保存
      3.打开该客户详情
      4.编辑客户，切回"否"
      5.保存
    expected: |
      1.客户表单有布尔字段"是否伙伴"
      2.设置为是后详情显示为伙伴客户
      3.可修改
    status: 草稿
