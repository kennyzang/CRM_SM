- id: TC-LEAD-011
  module: 线索
  name: 【SOW#2】线索分类—伙伴关联从现有客户选
  category: CustomRule/Linkage
  role: 销售人员
  priority: P0
  source: SOW需求#2（Securemetric配置）：线索须分类为'终端用户'或'伙伴'，选'伙伴'须从现有客户中选择
  precondition: '有至少一个现有客户C；

    线索新建表单已配置

    '
  steps: '1.新建线索，在分类字段选"终端用户"

    2.观察关联客户字段

    3.改选分类为"伙伴"

    4.观察关联客户字段变化

    5.选客户C

    6.保存

    '
  expected: '1.选"终端用户"时关联客户字段可选填或隐藏

    2.选"伙伴"时关联客户字段变为必填，只能从现有客户选

    3.保存成功，线索关联客户C

    '
  status: 草稿
- id: TC-LEAD-012
  module: 线索
  name: 【SOW#1】按注册码线索冲突检查
  category: CustomRule/Conflict
  role: 销售人员
  priority: P0
  source: SOW需求#1（Easycraft定制开发）：创建新线索时根据'公司注册码'验证防止重复参与或冲突
  precondition: '已有线索L，其"公司注册码"为 REG-001；

    存在另一条线索或其他数据也使用了 REG-001

    '
  steps: '1.新建一条线索

    2.在公司注册码字段输入 REG-001

    3.尝试保存

    4.在公司注册码字段输入一个全新未使用的注册码

    5.尝试保存

    '
  expected: '1.保存失败，系统提示注册码冲突

    2.输入新注册码后可正常保存

    '
  status: 草稿
- id: TC-LEAD-013
  module: 线索
  name: 【SOW#3】线索交叉销售冲突预防
  category: CustomRule/Conflict
  role: 销售人员
  priority: P0
  source: SOW需求#3（Easycraft定制开发）：若销售代表尝试添加关联客户已由其他销售代表负责的线索，系统须触发冲突警告并阻止表单提交
  precondition: '客户C已由销售代表A负责（A是C的负责人）；

    销售代表B（与A不同的负责人）登录

    '
  steps: '1.B新建线索，在"关联客户"字段选择客户C

    2.观察系统行为

    3.尝试强制提交

    4.B新建线索，选择未被其他销售负责的客户D

    '
  expected: '1.系统触发冲突警告："该客户已由其他销售代表负责"

    2.表单提交被阻止

    3.选择无冲突客户D可以正常提交

    '
  status: 草稿
